<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tinkl</title>
  <meta name="description" content="Tinkl — see who's free, send a shake, and plan with your people." />
  <meta property="og:title" content="You're invited on Tinkl" />
  <meta property="og:description" content="Tap to open the invite in Tinkl." />
  <meta property="og:image" content="https://tinkl.au/og-image.svg" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    /* GitHub Pages serves this file for every unknown path, including
       /invite/<code> and /join/<code>, so all asset paths are root-relative. */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #7C3AED 0%, #A78BFA 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      color: #fff;
    }
    .card {
      background: rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      padding: 40px 28px;
      max-width: 400px;
      width: 100%;
      text-align: center;
    }
    .logo { font-size: 48px; margin-bottom: 16px; }
    h1 { font-size: 24px; font-weight: 800; margin-bottom: 8px; }
    p { font-size: 15px; opacity: 0.9; line-height: 1.5; margin-bottom: 28px; }
    .btn {
      display: block;
      padding: 14px 24px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      margin: 10px 0;
    }
    .btn-primary { background: #fff; color: #7C3AED; }
    .btn-secondary { background: rgba(255, 255, 255, 0.18); color: #fff; border: 1px solid rgba(255, 255, 255, 0.3); }
    .hint { font-size: 13px; opacity: 0.75; margin-top: 18px; margin-bottom: 0; }
    .home { color: #fff; font-size: 14px; opacity: 0.85; }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo" id="logo">&#128197;</div>
    <h1 id="title">Page not found</h1>
    <p id="body">This page doesn't exist. It may have been moved or removed.</p>
    <div id="actions" hidden>
      <a class="btn btn-primary" id="open" href="#">Open in Tinkl</a>
      <a class="btn btn-secondary" href="https://apps.apple.com/app/tinkl/id6744145937">Get Tinkl on the App Store</a>
      <a class="btn btn-secondary" href="https://play.google.com/store/apps/details?id=com.buttacavoli.tinkl">Get Tinkl on Google Play</a>
      <p class="hint">Already installed? Tap "Open in Tinkl". New to Tinkl? Install it, then tap this link again.</p>
    </div>
    <a class="home" id="home" href="/">Go to tinkl.au</a>
  </main>
  <script>
    // Maps a path to the landing copy and the app link, or null for a real 404.
    //   /invite/<code>                   friend invite
    //   /join/<code>                     calendar invite
    //   /calendar/<uuid>/event/<uuid>    event shared from the iMessage extension
    //   /calendar/<uuid>/wrapped         Tinkl Wrapped
    //   /calendar/<uuid>                 calendar link
    //   /friend-profile/<uuid>           friend profile
    // These are the Universal Link paths in .well-known/apple-app-site-association
    // (all but the Siri-only /create-event). Keep the three in sync: the AASA,
    // this page, and lib/deepLinks.ts / lib/nativeIntent.ts in the app.
    // The iMessage card carries the event URL so that recipients without the
    // app can open it; before this page knew it, they got "Page not found"
    // (review F-4.2). Ids are validated, then encoded into the app link.
    function tinklLanding(pathname) {
      var uuid = "[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}";
      var invite = pathname.match(/^\/(invite|join)\/([A-Za-z0-9_-]{4,64})\/?$/);
      if (invite) {
        var kind = invite[1];
        return {
          copy: kind === "invite"
            ? { logo: "🤝", title: "You've been invited!", body: "Someone wants to connect with you on Tinkl, the social planning app for friends." }
            : { logo: "📅", title: "Join a calendar on Tinkl", body: "You've been invited to a shared calendar. Open it in Tinkl to see what's planned and join in." },
          href: "tinkl://" + kind + "/" + encodeURIComponent(invite[2])
        };
      }
      var event = pathname.match(new RegExp("^/calendar/(" + uuid + ")/event/(" + uuid + ")/?$"));
      if (event) {
        return {
          copy: { logo: "🎉", title: "You've been invited to an event", body: "A friend shared an event with you on Tinkl, the social planning app for friends. Open it in Tinkl to see the details and RSVP." },
          href: "tinkl://calendar/event/" + encodeURIComponent(event[2].toLowerCase()) +
            "?calendarId=" + encodeURIComponent(event[1].toLowerCase())
        };
      }
      var wrapped = pathname.match(new RegExp("^/calendar/(" + uuid + ")/wrapped/?$"));
      if (wrapped) {
        return {
          copy: { logo: "✨", title: "A Tinkl Wrapped for you", body: "A friend shared their calendar's year in review. Open it in Tinkl to watch it." },
          href: "tinkl://calendar/" + encodeURIComponent(wrapped[1].toLowerCase()) + "/wrapped"
        };
      }
      var calendar = pathname.match(new RegExp("^/calendar/(" + uuid + ")/?$"));
      if (calendar) {
        return {
          copy: { logo: "📅", title: "A shared calendar on Tinkl", body: "Someone shared a calendar with you on Tinkl. Open it in Tinkl to see what's planned." },
          href: "tinkl://calendar/" + encodeURIComponent(calendar[1].toLowerCase())
        };
      }
      var profile = pathname.match(new RegExp("^/friend-profile/(" + uuid + ")/?$"));
      if (profile) {
        return {
          copy: { logo: "👋", title: "Someone on Tinkl", body: "A friend shared a Tinkl profile with you. Open it in Tinkl to connect." },
          href: "tinkl://friend-profile/" + encodeURIComponent(profile[1].toLowerCase())
        };
      }
      return null;
    }

    (function () {
      if (typeof document === "undefined") return;
      var landing = tinklLanding(window.location.pathname);
      if (!landing) return;
      var copy = landing.copy;
      document.title = copy.title + " — Tinkl";
      document.getElementById("logo").textContent = copy.logo;
      document.getElementById("title").textContent = copy.title;
      document.getElementById("body").textContent = copy.body;
      document.getElementById("open").setAttribute("href", landing.href);
      document.getElementById("actions").hidden = false;
      document.getElementById("home").hidden = true;
    })();
  </script>
</body>
</html>
